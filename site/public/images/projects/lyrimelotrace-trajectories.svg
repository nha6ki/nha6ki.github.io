<title id="title">LyriMeloTrace — Tracing Emotion in Lyrics and Music</title>
<desc id="desc">Full-song data illustration for Schubert's Frühlingstraum, HU33. Blue: 36 lyric-line predictions from XLM-RoBERTa-large MSE, split into six vocal sections. Amber: 84 DEAM six-second window means. Paths use the demo's per-axis PCHIP interpolation and a shared fixed VA mapping, without per-series normalization. No cross-modal calibration or accuracy claim. This is an illustration from saved data, not a screenshot.</desc>
