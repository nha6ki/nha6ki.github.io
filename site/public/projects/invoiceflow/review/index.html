<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice Review</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#182e30;background:#f4f6f5}*{box-sizing:border-box}
body{margin:0}header{padding:20px 28px;background:#163c38;color:white;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}header small{color:#bfd1ca}
main{max-width:1600px;margin:auto;padding:24px}button{cursor:pointer;border:1px solid #a7bdb5;background:white;border-radius:6px;padding:9px 14px;color:#163c38;font:inherit}button.primary{background:#176b58;color:white;border-color:#176b58}button:disabled{opacity:.5;cursor:default}
section,details{background:white;border:1px solid #dbe4df;border-radius:9px;padding:18px;margin-bottom:18px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px}input,select,textarea{padding:8px;border:1px solid #b6c8bf;border-radius:4px;font:inherit;max-width:100%;background:white}
input{width:100%}label{display:block;font-size:13px;color:#526963}select{max-width:480px}textarea{width:100%;min-height:65px}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #e4ebe7;vertical-align:top}th{font-size:12px;color:#526963}td input{min-width:65px}tbody tr:hover{background:#f3f8f5}.split{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(550px,1.1fr);gap:18px}.pdf{height:850px;width:100%;border:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.badge{font-size:12px;background:#e3f0e8;border-radius:20px;padding:4px 10px}.warn{background:#fff2dd;color:#7a4b00}.issues{border-left:4px solid #bf852a;padding:10px 16px;background:#fff8eb;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.muted{color:#60756e;font-size:13px}.scroll{overflow-x:auto}#message{position:sticky;top:0;padding:12px 18px;background:#e2eee9;z-index:2;margin-bottom:15px;border-radius:6px}#message:empty{display:none}[hidden]{display:none!important}@media(max-width:1000px){.split{grid-template-columns:1fr}.pdf{height:480px}main{padding:12px}}
</style>
<header><div><h1>Invoice Review</h1><small>書類の確認と承認</small> · <a style="color:inherit" href="../">プロジェクト紹介</a></div><button onclick="load()">一覧を更新</button></header>
<main><div id="message" role="status"></div>
<section><h2>公開サンプル</h2>
<p>受領超過の請求書または明細金額の不一致を開き、照合から承認まで試せます。
処理はブラウザ内で行います。ページを再読み込みすると初期状態に戻ります。</p>
<button id="sample-receipt" type="button">サンプル受領を10個追加</button>
<div hidden><select id="answer"></select><select id="po"></select>
<input id="comma" type="checkbox"><button id="ingest" disabled>取り込む</button></div></section>
<section><h2>請求書一覧</h2><div class="scroll"><table><thead><tr><th>請求書番号</th><th>仕入先</th><th>税込合計</th><th>状態</th><th></th></tr></thead><tbody id="queue"></tbody></table></div></section>
<div id="detail" hidden>
<div class="split"><section><h2>原本PDF</h2><p id="pdfnote" class="muted"></p><iframe class="pdf" title="原本請求書" id="pdf"></iframe></section>
<div><section><h2 id="title">抽出値と発注値</h2><p class="muted">編集内容は承認時に保存されます。発注値は取り込み時点の記録です。</p><div id="fields" class="fields"></div>
<h3>請求書の明細（編集可）</h3><div class="scroll"><table><thead><tr><th>行ID</th><th>品目名</th><th>数量</th><th>純単価</th><th>税抜明細額</th></tr></thead><tbody id="lines"></tbody></table></div>
<h3>発注台帳の明細</h3><div id="order" class="scroll"></div><div id="issues"></div><div id="reconciliation" class="scroll" hidden></div>
<div id="approval"><label>確認者<input id="actor" placeholder="確認者名"></label><label>確認・修正理由<textarea id="note" placeholder="原本を確認した内容や修正理由を記入"></textarea></label><div class="toolbar"><button id="validate">照合し直す</button><button class="primary" id="approve">承認して登録</button></div></div><p id="registered" class="badge" hidden>登録済みです</p>
</section><details><summary>元の抽出値・正規化・承認履歴</summary><pre id="history"></pre></details></div></div></div>
<section><h2>登録済み台帳</h2><div id="ledger" class="scroll"></div></section></main>
<script src="./review-client.js"></script>
<script>
const $=id=>document.getElementById(id);
const labels={invoice_number:"請求書番号",issue_date:"発行日",supplier:"仕入先",currency:"通貨",po_number:"発注番号",gross_total:"税込合計"};
const statusNames={registered:"登録済み",needs_review:"要確認",ready_for_approval:"承認待ち"};
const reasons={quantity_exceeds_available:"今回請求が承認可能な残数を超えています",nonpositive_quantity:"請求数量は正の値が必要です",legacy_approval_exists:"この発注には旧方式の承認済み請求があります",three_way_required:"この発注には受領照合が必要です",missing_or_invalid:"必須項目が未入力または形式不正",invalid_date:"日付形式不正",invalid_decimal:"数値形式不正",po_mismatch:"発注値と不一致",arithmetic_mismatch:"数量×単価と明細額が不一致",ambiguous_item_names:"同名品目があり対応を特定できません",item_set_mismatch:"品目の組み合わせが発注と異なります"};
let current=null;
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function message(text){$("message").textContent=text}
function api(path, body) { return window.invoiceReviewRequest(path, body); }
function table(headers,rows){const t=el("table"),head=el("tr");for(const h of headers)head.append(el("th",h));t.append(head);for(const row of rows){const tr=el("tr");for(const v of row)tr.append(el("td",v??"—"));t.append(tr)}return t}
function reconciliation(rows=[]){
  const target=$("reconciliation");
  target.hidden=!rows.length;
  target.replaceChildren();
  if(!rows.length)return;
  target.append(el("h3","発注・受領・請求の数量照合"),table(
    ["品目","発注","受領累計","承認済み","今回請求","承認可能な残数","超過","受領記録","承認済み請求書"],
    rows.map(r=>[r.item,r.ordered,r.received,r.approved,r.requested,r.available,r.excess,
                 r.receipt_ids.join(", "),r.prior_invoices.join(", ")])));
}
function issues(list){
  const target=$("issues");
  target.replaceChildren();
  target.className=list.length?"issues":"";
  if(!list.length){
    target.append(el("p","照合結果に問題はありません。原本を確認して承認してください。"));
    return;
  }
  for(const i of list){
    let text=(labels[i.field]||i.field)+" — "+(reasons[i.reason]||i.reason);
    if(i.reason==="arithmetic_mismatch" && "expected" in i){
      text+=" ／ 数量 "+i.quantity+" × 純単価 "+i.unit_price+" = "+i.expected;
      text+=" ／ 入力明細額 "+i.actual+"（差額 "+i.difference+"）";
    }else if("expected" in i){
      text+=" ／ 発注 "+(i.expected??"未入力")+"・請求入力 "+(i.actual??"未入力");
    }else if(i.reason==="invalid_decimal" && "actual" in i){
      text+=" ／ 請求入力 "+(i.actual??"未入力");
    }
    target.append(el("div",text));
  }
}
function invoice(){const obj=structuredClone(current.current);for(const k of Object.keys(labels)){const v=$("f-"+k).value;obj[k]=v===""?null:v}obj.lines=[...$("lines").children].map(tr=>{const line=structuredClone(current.current.lines[Number(tr.dataset.index)]);for(const input of tr.querySelectorAll("input"))line[input.dataset.key]=input.value===""?null:input.value;return line});return obj}
async function openReview(id){current=await api("/api/review/"+id);$("detail").hidden=false;$("title").textContent="請求書 "+current.current.invoice_number;$("fields").replaceChildren();for(const [k,label]of Object.entries(labels)){const box=el("label",label),input=el("input");input.id="f-"+k;input.value=current.current[k]??"";input.disabled=current.status==="registered";box.append(input);if(k in current.po)box.append(el("div","発注 "+current.po[k]));$("fields").append(box)}
$("lines").replaceChildren();current.current.lines.forEach((line,index)=>{const tr=el("tr");tr.dataset.index=index;for(const k of ["line_id","item","quantity","unit_price","line_total"]){const td=el("td"),input=el("input");input.dataset.key=k;input.value=line[k]??"";input.disabled=current.status==="registered";td.append(input);tr.append(td)}$("lines").append(tr)});
$("order").replaceChildren(table(["品目名","数量","純単価","税抜明細額"],current.po.lines.map(l=>[l.item,l.quantity,l.unit_price,l.line_total])));
$("pdf").hidden=false;$("pdf").src="./sample-"+id+".pdf";$("pdfnote").textContent="公開用のサンプル請求書";
$("approval").hidden=current.status==="registered";$("registered").hidden=current.status!=="registered";$("note").value="";$("history").textContent=JSON.stringify({raw:current.raw,normalization:current.normalization,events:current.events},null,2);issues(current.status==="registered"?[]:current.issues);reconciliation(current.reconciliation)}
async function load(){const [rows,ledger,files]=await Promise.all([api("/api/reviews"),api("/api/ledger"),api("/api/files")]);$("queue").replaceChildren();for(const r of rows){const tr=el("tr");for(const v of [r.invoice.invoice_number,r.invoice.supplier,r.invoice.gross_total+" "+r.invoice.currency,statusNames[r.status]||r.status])tr.append(el("td",v));const td=el("td"),b=el("button","開く");b.onclick=()=>openReview(r.id).catch(e=>message(e.message));td.append(b);tr.append(td);$("queue").append(tr)}if(!rows.length)$("queue").append(el("tr","確認対象はまだありません。上から抽出結果を取り込んでください。"));
for(const [id,values]of [["answer",files.answers],["po",files.pos]]){const selected=$(id).value;$(id).replaceChildren();for(const value of values){const o=el("option",value);o.value=value;$(id).append(o)}if(values.includes(selected))$(id).value=selected}
$("ledger").replaceChildren(table(["請求書番号","仕入先","税込合計","登録日時"],ledger.map(r=>[r.invoice_number,r.supplier,r.invoice.gross_total+" "+r.invoice.currency,r.created])))}
$("ingest").onclick=async()=>{try{const r=await api("/api/ingest",{answer:$("answer").value,po:$("po").value,comma:$("comma").checked});await load();await openReview(r.id);message(r.reused?"取り込み済みの記録を表示しました。":"抽出結果を取り込みました。")}catch(e){message(e.message)}};
$("validate").onclick=async()=>{try{const r=await api("/api/validate",{id:current.id,invoice:invoice()});issues(r.issues);reconciliation(r.reconciliation);message("編集値で照合しました。保存は承認時に行います。")}catch(e){message(e.message)}};
$("approve").onclick=async()=>{const b=$("approve");b.disabled=true;try{const r=await api("/api/approve",{id:current.id,invoice:invoice(),actor:$("actor").value,note:$("note").value});if(r.status==="registered"){await load();await openReview(current.id);message(r.reused?"登録済みです。追加登録はありません。":"承認し、台帳に登録しました。")}else{if(r.issues)issues(r.issues);reconciliation(r.reconciliation);message(r.status==="duplicate_invoice"?"同じ仕入先・請求書番号がすでに登録されています。":"不一致が残っています。照合結果を確認してください。")}}catch(e){message(e.message)}finally{b.disabled=false}};
$("sample-receipt").onclick=async()=>{
  try{
    const result=await api("/api/demo/receipt",{});
    if(current)await openReview(current.id);
    message(result.reused?"この受領はすでに登録されています。":"追加受領10個を登録しました。");
  }catch(e){message(e.message)}
};
message("照合エンジンを読み込んでいます。初回は少し時間がかかります。");
load().then(()=>message("")).catch(e=>message(e.message));
</script></html>
