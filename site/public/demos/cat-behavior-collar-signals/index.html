<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat Behavior &amp; Collar Sensor Signals | FeliAdapt</title>
    <link rel="stylesheet" href="room.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <h1 id="heading" lang="en">Cat Behavior &amp; Collar Sensor Signals</h1>
      </div>
      <div class="actions">
        <div class="rate">
          <label id="speedLabel" for="speed">再生速度</label
          ><select id="speed">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
            <option value="10">10×</option>
          </select>
        </div>
        <button id="mix">配置をシャッフル</button>
        <details>
          <summary id="about">表示情報</summary>
          <div class="help">
            <p id="dataHelp"></p>
            <h2 id="waveHeading"></h2>
            <p id="scale"></p>
            <h2 id="replayHeading"></h2>
            <p id="explain"></p>
            <h2 id="source"></h2>
            <p>
              <a
                id="citation"
                href="https://doi.org/10.6084/m9.figshare.23605842.v2"
              ></a>
              ·
              <a href="https://creativecommons.org/licenses/by/4.0/"
                >CC BY 4.0</a
              >
            </p>
          </div>
        </details>
        <button type="button" id="language" lang="en">English</button>
      </div>
    </header>
    <main id="field" aria-label="12匹の猫の観察フィールド"></main>
    <aside id="panel" hidden>
      <button id="close">閉じる</button><b id="name"></b>
      <div id="info"></div>
    </aside>
    <script src="records.js"></script>
    <script src="language.js"></script>
    <script src="behavior.js"></script>
    <script src="cat.js"></script>
    <script src="trace.js"></script>
    <script src="movement.js"></script>
    <script src="room.js"></script>
  </body>
</html>
