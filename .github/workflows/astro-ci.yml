name: Astro CI

on:
  push:
    branches:
      - redesign-astro
    paths:
      - 'site/**'
      - '.github/workflows/astro-ci.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/astro-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Check and build Astro
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify generated files
        run: |
          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/blog/index.html
          test -f dist/projects/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/og-default.png
          test -f dist/sitemap-index.xml
